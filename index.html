<!DOCTYPE html>
<html lang="">
<head>
  <meta charset="UTF-8" />
  <title>Job Application Tracker</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="" />
  <link rel="icon" href="favicon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1 id="main-header">Welcome to the Job Application Tracker!</h1>
  <p id = "explanation-p">In the application tracker you may:</p>

  <div id = "explanation-list">
    <ul id = "list-detail">
        <li>Add applications with details</li>
        <li>Edit status of applications</li>
        <li>Filter by status, position, or company name</li>
    </ul>
  </div>

  <div id="job-board">
    <label for="company">*Company Name:</label>
    <input id = "company"  type="text">
    <label for="position">*Position Name:</label>
    <input id = "position" type="text">
    <label for="status">Status:</label>
    <select id ="status" class = "status">
      <option value = "">Select:</option>
      <option value = "waiting">Waiting</option>
      <option value = "hired">Hired</option>
      <option value ="denied">Denied</option>
      <option value = "ghosted">Ghosted</option>
      <option value ="archived">Archived</option>
    </select>
    <label for="notes">Notes:</label>
    <input id = "notes" name ="notes" type="text">
    <div id = "buttons">
    <button id = "job-board-save-button" onclick="afterPressDiplayJobs(); clearAll()" type ="button">Submit</button>
    <button id = "clearInput" onclick="clearAll()" type = "button">Clear Input</button>
    </div>
  </div>

  <div id="editModal" class="modal-hidden">
  <div id="modal-content">
    <span id="closeModal">&times;</span>
    <h2>Edit Job</h2>
    <label for="company">Company Name:</label>
    <input id = "editCompany"  type="text">
    <label for="position">Position Name:</label>
    <input id = "editPosition" type="text">
    <label for="status">Select an option:</label>
    <select id ="editStatus" class = "status">
      <option value = "none">Select:</option>
      <option value = "waiting">Waiting</option>
      <option value = "hired">Hired</option>
      <option value ="denied">Denied</option>
      <option value = "ghosted">Ghosted</option>
      <option value ="archived">Archived</option>
    </select>
    <label for="notes">Notes:</label>
    <input id = "editNotes" name ="notes" type="text">
    <button id="saveEditBtn">Save</button>
  </div>
  </div>


  <div id="job-table-container">
    <table id="job-table">
      <thead>
        <tr>
          <th>Company</th>
          <th>Position</th>
          <th>Status</th>
          <th>Notes</th>
          <th>Edit</th>
        </tr>
      </thead>
      <tbody id="job-table-body">
      </tbody>
    </table>
  </div>

  <div id="demo"></div>

  <div id = "filter-job">
  <input type = "text" placeholder = "Filter by status, name, or position" id = "filter">
  <button type = "button" onclick="filterJobs()">Filter</button>
  <button type = "button" onclick="renderJobs(); clearReset()" id = "resetBtn">Reset</button>
  </div>

  <script src="job-application-script.js"></script>
</body>
<footer id = 'footer'>
  <ul>
    <li id = "contact-list"><a id = "contact-link" href ="contact-me.html" target="_blank" style="color:whitesmoke">Contact Me</a></li>
  </ul>
</footer>
</html>
