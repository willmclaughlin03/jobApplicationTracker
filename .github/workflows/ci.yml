name: CI

on:
  pull_request:
    branches:
      - staging
      - main
  push:
    branches:
      - staging
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-lint-build:
    name: unit-lint-build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out the event commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Print runtime versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test:ci

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-build.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-only-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-build-only-service-role-key
          CSRF_SECRET: ci-build-only-secret-at-least-32-characters
        run: npm run build
