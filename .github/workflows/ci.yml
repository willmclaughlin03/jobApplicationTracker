name: CI

on:
  pull_request:
    branches:
      - staging
      - main
  push:
    branches:
      - staging
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-lint-build:
    name: unit-lint-build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out the event commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Print runtime versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test:ci

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-build.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-only-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-build-only-service-role-key
          CSRF_SECRET: ci-build-only-secret-at-least-32-characters
        run: npm run build

      - name: Smoke test Sharp image optimization
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-build.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-only-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-build-only-service-role-key
          CSRF_SECRET: ci-build-only-secret-at-least-32-characters
        shell: bash
        run: |
          set -euo pipefail

          server_log="$RUNNER_TEMP/next-server.log"
          first_headers="$RUNNER_TEMP/next-image-first.headers"
          first_body="$RUNNER_TEMP/next-image-first.png"
          first_status_file="$RUNNER_TEMP/next-image-first.status"
          second_headers="$RUNNER_TEMP/next-image-second.headers"
          second_body="$RUNNER_TEMP/next-image-second.png"
          second_status_file="$RUNNER_TEMP/next-image-second.status"
          image_url='http://127.0.0.1:3000/_next/image?url=%2Ffavicon.png&w=64&q=75'

          npm start -- --hostname 127.0.0.1 --port 3000 >"$server_log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT

          ready=false
          for _ in {1..30}; do
            if curl --fail --silent --show-error --output /dev/null \
              http://127.0.0.1:3000/favicon.png; then
              ready=true
              break
            fi

            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo 'Next server exited before becoming ready.' >&2
              tail -n 100 "$server_log" >&2
              exit 1
            fi

            sleep 1
          done

          if [[ "$ready" != true ]]; then
            echo 'Next server did not become ready within 30 seconds.' >&2
            tail -n 100 "$server_log" >&2
            exit 1
          fi

          curl --silent --show-error \
            --dump-header "$first_headers" \
            --output "$first_body" \
            --write-out '%{http_code}\n' \
            "$image_url" >"$first_status_file"
          curl --silent --show-error \
            --dump-header "$second_headers" \
            --output "$second_body" \
            --write-out '%{http_code}\n' \
            "$image_url" >"$second_status_file"
          read -r first_status <"$first_status_file"
          read -r second_status <"$second_status_file"
          first_status="${first_status%$'\r'}"
          second_status="${second_status%$'\r'}"

          if [[ "$first_status" != 200 ]]; then
            echo 'First image optimizer request did not return HTTP 200.' >&2
            exit 1
          fi
          if [[ "$second_status" != 200 ]]; then
            echo 'Second image optimizer request did not return HTTP 200.' >&2
            exit 1
          fi
          if [[ ! -s "$first_body" ]]; then
            echo 'First image optimizer response body is empty.' >&2
            exit 1
          fi
          if [[ ! -s "$second_body" ]]; then
            echo 'Second image optimizer response body is empty.' >&2
            exit 1
          fi
          if ! grep -Eiq '^content-type:[[:space:]]*image/png([[:space:]]*;.*)?\r?$' \
            "$first_headers"; then
            echo 'First image optimizer response is not image/png.' >&2
            exit 1
          fi
          if ! grep -Eiq '^content-type:[[:space:]]*image/png([[:space:]]*;.*)?\r?$' \
            "$second_headers"; then
            echo 'Second image optimizer response is not image/png.' >&2
            exit 1
          fi

          # These exact values intentionally enforce Next's runtime cache contract.
          if ! grep -Eiq '^x-nextjs-cache:[[:space:]]*MISS[[:space:]]*\r?$' \
            "$first_headers"; then
            echo 'First image optimizer response did not report a cache MISS.' >&2
            exit 1
          fi
          if ! grep -Eiq '^x-nextjs-cache:[[:space:]]*HIT[[:space:]]*\r?$' \
            "$second_headers"; then
            echo 'Second image optimizer response did not report a cache HIT.' >&2
            exit 1
          fi
