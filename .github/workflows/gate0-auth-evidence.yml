name: Gate-0 Auth Evidence

on:
  workflow_dispatch:
    inputs:
      confirm_disposable_auth_mutations:
        description: Create, revoke, ban, and delete only synthetic Gate-0 users
        required: true
        default: false
        type: boolean

permissions: {}

jobs:
  guard-staging-ref:
    name: guard-staging-ref
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Require staging and explicit disposable-mutation confirmation
        shell: bash
        env:
          CONFIRMED: ${{ inputs.confirm_disposable_auth_mutations }}
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/staging" ]]; then
            echo "::error::Gate-0 auth evidence requires the exact staging branch ref."
            exit 1
          fi

          if [[ "${CONFIRMED}" != "true" ]]; then
            echo "::error::Gate-0 auth evidence requires explicit disposable-mutation confirmation."
            exit 1
          fi

  capture-evidence:
    name: capture-evidence
    needs: guard-staging-ref
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    environment:
      name: gate0-preproduction-evidence
      deployment: false
    concurrency:
      group: gate0-preproduction-auth-evidence
      cancel-in-progress: false

    steps:
      - name: Check out the dispatched staging commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      # This refusal proof intentionally precedes npm ci and must remain dependency-free,
      # using only Node.js built-ins so the pre-install proof remains valid.
      - name: Prove wrong Supabase project refusal
        env:
          GATE0_SUPABASE_URL: ${{ secrets.GATE0_SUPABASE_URL }}
          GATE0_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.GATE0_SUPABASE_PUBLISHABLE_KEY }}
          GATE0_SUPABASE_SECRET_KEY: ${{ secrets.GATE0_SUPABASE_SECRET_KEY }}
          GATE0_SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.GATE0_SUPABASE_MANAGEMENT_TOKEN }}
          GATE0_SUPABASE_PROJECT_REF: ${{ secrets.GATE0_SUPABASE_PROJECT_REF }}
        run: node scripts/capture-gate0-auth-evidence.js --prove-project-ref-refusal

      - name: Install exact dependencies
        run: npm ci

      - name: Prove the offline fixture and sanitizer contracts
        run: >-
          node node_modules/jest/bin/jest.js
          --runTestsByPath
          src/testSupport/__tests__/gate0AuthEvidence.test.js
          src/testSupport/__tests__/authV2ContractFixtures.test.js
          --runInBand
          --no-cache

      - name: Validate dedicated Gate-0 evidence configuration
        env:
          GATE0_SUPABASE_URL: ${{ secrets.GATE0_SUPABASE_URL }}
          GATE0_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.GATE0_SUPABASE_PUBLISHABLE_KEY }}
          GATE0_SUPABASE_SECRET_KEY: ${{ secrets.GATE0_SUPABASE_SECRET_KEY }}
          GATE0_SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.GATE0_SUPABASE_MANAGEMENT_TOKEN }}
          GATE0_SUPABASE_PROJECT_REF: ${{ secrets.GATE0_SUPABASE_PROJECT_REF }}
          GATE0_AUTH_EVIDENCE_ALLOWED: 'true'
        run: node scripts/capture-gate0-auth-evidence.js --preflight-only

      - name: Validate hosted Gate-0 credentials without mutations
        env:
          GATE0_SUPABASE_URL: ${{ secrets.GATE0_SUPABASE_URL }}
          GATE0_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.GATE0_SUPABASE_PUBLISHABLE_KEY }}
          GATE0_SUPABASE_SECRET_KEY: ${{ secrets.GATE0_SUPABASE_SECRET_KEY }}
          GATE0_SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.GATE0_SUPABASE_MANAGEMENT_TOKEN }}
          GATE0_SUPABASE_PROJECT_REF: ${{ secrets.GATE0_SUPABASE_PROJECT_REF }}
        run: >-
          node scripts/capture-gate0-auth-evidence.js
          --hosted-credential-preflight

      - name: Capture sanitized Gate-0 auth evidence
        env:
          GATE0_SUPABASE_URL: ${{ secrets.GATE0_SUPABASE_URL }}
          GATE0_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.GATE0_SUPABASE_PUBLISHABLE_KEY }}
          GATE0_SUPABASE_SECRET_KEY: ${{ secrets.GATE0_SUPABASE_SECRET_KEY }}
          GATE0_SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.GATE0_SUPABASE_MANAGEMENT_TOKEN }}
          GATE0_SUPABASE_PROJECT_REF: ${{ secrets.GATE0_SUPABASE_PROJECT_REF }}
          GATE0_AUTH_EVIDENCE_ALLOWED: 'true'
        run: node scripts/capture-gate0-auth-evidence.js
