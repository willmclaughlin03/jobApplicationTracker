<!DOCTYPE html>
<html lang="">
<head>
  <meta charset="UTF-8" />
  <title>Job Application Tracker</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="" />
  <link rel="icon" href="favicon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1 id="main-header">Welcome to the Job Application Tracker!</h1>
  <p id = "explanation-p">In the application tracker you may:</p>

  <div id = "explanation-list">
    <ul id = "list-detail">
        <li>Add applications with details</li>
        <li>Edit status of applications</li>
        <li>Filter by status or company name</li>
    </ul>
  </div>

  <div id="job-board">
    <label for="company">Company Name:</label>
    <input id = "company"  type="text">
    <label for="position">Position Name:</label>
    <input id = "position" type="text">
    <label for="status">Select an option:</label>
    <select id ="status" class = "status">
      <option value = "none">Select:</option>
      <option value = "waiting">Waiting</option>
      <option value = "hired">Hired</option>
      <option value ="denied">Denied</option>
      <option value = "ghosted">Ghosted</option>
    </select>
    <label for="notes">Notes:</label>
    <input id = "notes" name ="notes" type="text">
    <button id = "job-board-save-button" onclick="afterPressDiplayJobs()" type ="button">Submit</button>
  </div>

  <div id = "job-display-board">
  <ul id = "job-display-board-list">
    <div id ="job-div"></div>
  </ul>
      
  </div>

  <div id = "filter-job">
  <input type = "text" placeholder = "Filter Job Entries.." id = "filter">
  <button type = "button" onclick="filterJobs()">Filter</button>
  <button type = "button" onclick="renderJobs()">Reset</button>
  </div>

  <script src="job-application-script.js"></script>
</body>
<footer id = 'footer'>
  <ul>
    <li id = "contact-list"><a id = "contact-link" href ="contact-me.html" target="_blank">Contact Me</a></li>
  </ul>
</footer>
</html>
